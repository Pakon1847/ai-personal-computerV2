[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipc"
version = "0.0.1"
description = "AI Personal Computer on Raspberry Pi 5 - senior project"
requires-python = ">=3.11"
# ตั้งใจให้ส่วนเครื่องมือวัดใช้แค่ standard library ของ Python
# จะได้รันบน Pi ที่เพิ่งลง OS ได้ทันทีโดยไม่ต้องติดตั้งอะไรเพิ่ม
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]
# หน้าจอ: ใช้ PySide6-Essentials (มี Qt Quick/QML ครบ) แทน PySide6 เต็ม เพราะเล็กกว่ามาก
# ประหยัดพื้นที่บน microSD ของ Pi · ต้องใช้ glibc >= 2.39 บน aarch64 (BRIEF หัวข้อ 2)
ui = ["PySide6-Essentials>=6.8"]
# ใบหน้า (การ์ด 0005): OpenCV รุ่น headless (ไม่มี GUI ของตัวเอง เล็กกว่า) รัน YuNet/SFace/PAD ได้ในตัว
# ไม่ใช้ onnxruntime/FastAPI เพื่อไม่เพิ่ม RAM และพอร์ตบน Pi (H4) · numpy มากับ OpenCV อยู่แล้ว
vision = ["opencv-python-headless>=4.10", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aipc = ["ui/qml/AipcUi/*", "ui/fonts/*", "skills/builtin/*.md", "skills/builtin/*.json", "vision/models/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
