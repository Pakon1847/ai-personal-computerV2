[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipc"
version = "0.0.1"
description = "AI Personal Computer on Raspberry Pi 5 - senior project"
requires-python = ">=3.11"
# ตั้งใจให้ส่วนเครื่องมือวัดใช้แค่ standard library ของ Python
# จะได้รันบน Pi ที่เพิ่งลง OS ได้ทันทีโดยไม่ต้องติดตั้งอะไรเพิ่ม
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]
# หน้าจอ: ใช้ PySide6-Essentials (มี Qt Quick/QML ครบ) แทน PySide6 เต็ม เพราะเล็กกว่ามาก
# ประหยัดพื้นที่บน microSD ของ Pi · ต้องใช้ glibc >= 2.39 บน aarch64 (BRIEF หัวข้อ 2)
# ปฏิทิน Google แบบอ่านอย่างเดียว (การ์ด 0014): icalendar อ่านไฟล์ .ics · recurring-ical-events กางนัดซ้ำ
# (นัดที่แก้เฉพาะครั้ง · ครั้งที่ถูกลบ · เขตเวลา) · Python ล้วน · รุ่นที่ใช้ล็อกใน constraints.txt
ui = ["PySide6-Essentials>=6.8", "icalendar>=7.3", "recurring-ical-events>=3.8"]
# ใบหน้า (การ์ด 0005): OpenCV รุ่น headless (ไม่มี GUI ของตัวเอง เล็กกว่า) รัน YuNet/SFace/PAD ได้ในตัว
# ไม่ใช้ onnxruntime/FastAPI เพื่อไม่เพิ่ม RAM และพอร์ตบน Pi (H4) · numpy มากับ OpenCV อยู่แล้ว
vision = ["opencv-python-headless>=4.10", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aipc = ["ui/qml/AipcUi/*", "i18n/*.json", "ui/fonts/*", "skills/builtin/*.md", "skills/builtin/*.json", "skills/forge_prompt.md", "skills/app_catalog.json", "spikes/rating_page.html", "spikes/exam_review_page.html", "vision/models/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# สคริปต์ในโฟลเดอร์ผลวัดเป็นหลักฐาน: commit ก่อนวัดแล้วห้ามแก้ (H9) · ไม่จัดรูปแบบย้อนหลัง
# .claude/skills = สกิลของคนอื่นที่ติดตั้งมา (เช่น ui-ux-pro-max) ไม่จัดรูปแบบให้ต่างจากต้นฉบับ
extend-exclude = ["docs/benchmarks", ".claude/skills"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
