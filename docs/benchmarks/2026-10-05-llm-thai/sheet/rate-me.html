ลักษณะ | RAM | พื้นที่เก็บข้อมูล (Storage) |\n|--------|-----|-----------------------------|\n| **หน้าที่** | ใช้เก็บข้อมูลชั่วคราว ที่ใช้ในขณะทำงาน (เช่น โปรแกรม ข้อมูลที่กำลังใช้งาน) | ใช้เก็บข้อมูลระยะยาว เช่น ไฟล์ โปรแกรม ระบบปฏิบัติการ |\n| **ความเร็ว** | เร็วมาก (เข้าถึงได้ทันที) | ช้ากว่า (ต้องอ่านหรือเขียนข้อมูลจากหน่วยความจำ) |\n| **ขนาด** | จำกัด เช่น 8GB, 16GB ฯลฯ | ใหญ่กว่า เช่น 512GB, 1TB ฯลฯ |\n| **การลบข้อมูล** | ถ้าปิดโปรแกรมหรือปิดเครื่อง จะหายไปทันที | ข้อมูลยังคงอยู่ ถึงแม้จะปิดเครื่อง |\n| **ตัวอย่าง** | ข้อมูลที่กำลังใช้ในโปรแกรม เช่น หน้าเว็บ หรือไฟล์ที่กำลังเปิด | ไฟล์ภาพ วิดีโอ หรือโปรแกรมที่ต้องการใช้ซ้ำ |\n\n**สรุป:**  \nRAM คือ \"หน่วยความจำชั่วคราว\" ที่ใช้เร็วในการทำงาน แต่หายเมื่อปิดเครื่อง  \nพื้นที่เก็บข้อมูลคือ \"หน่วยความจำระยะยาว\" ที่เก็บข้อมูลไว้ตลอดเวลา\n\nถ้าเปรียบเทียบกันได้:  \nRAM = หน่วยความจำที่ใช้ตอนเล่นเกม (ต้องมีเพียงพอ)  \nStorage = ที่เก็บเกมทั้งชุดไว้ในห้องสมุด (แม้จะไม่เล่นก็ยังมีอยู่)", "score": ""}, {"id": "q04", "question": "RAM กับพื้นที่เก็บข้อมูลในคอมพิวเตอร์ต่างกันอย่างไร", "choice": "C", "answer": "RAM และพื้นที่เก็บข้อมูลในคอมพิวเตอร์ต่างกันดังนี้:\n\n- **RAM (Random Access Memory)**  \n  เป็นหน่วยความจำส่วนกลางที่ใช้เก็บข้อมูลชั่วคราวขณะทำงาน เช่น เนื้อหาหน้าจอ โปรแกรมที่กำลังรัน ข้อมูลชั่วคราว  \n  - เร็วมาก แต่หายไปเมื่อเครื่องปิด  \n  - ใช้ในการประมวลผลข้อมูลจริงเวลาทำงาน\n\n- **พื้นที่เก็บข้อมูล (Storage)**  \n  เช่น HDD, SSD ใช้เก็บข้อมูลระยะยาว เช่น ไฟล์เอกสาร โปรแกรม รูปภาพ เสียง  \n  - เก็บข้อมูลไว้ตลอดเวลาแม้เครื่องปิด  \n  - เร็วกว่า RAM ในการเข้าถึงข้อมูลระยะยาว\n\nสรุป: RAM เก็บข้อมูลชั่วคราวเพื่อทำงานจริง ส่วนพื้นที่เก็บข้อมูลเก็บข้อมูลไว้ระยะยาว", "score": ""}, {"id": "q05", "question": "ถ้าเป็นหวัด ควรดูแลตัวเองอย่างไร และเมื่อไรควรไปพบแพทย์", "choice": "A", "answer": "ควรดูแลตัวเองดังนี้:\n\n- พักผ่อนให้เพียงพอ  \n- เตรียมน้ำอุ่น น้ำสมุนไพร หรือเครื่องดื่มให้น้ำตาลต่ำเพื่อเสริมภูมิคุ้มกัน  \n- กินอาหารที่มีประโยชน์ เช่น ผัก ผลไม้ และโปรตีน  \n- ล้างมือบ่อย ๆ และหลีกเลี่ยงการสัมผัสผู้ป่วยคนอ y. I've been quite busy with work lately.", "score": ""}, {"id": "q17", "question": "คำว่า \"เกรงใจ\" แปลเป็นภาษาอังกฤษว่าอะไร และทำไมถึงแปลตรงตัวยาก", "choice": "A", "answer": "คำว่า \"เกรงใจ\" แปลเป็นภาษาอังกฤษว่า \"feel uneasy about\" หรือ \"be embarrassed/shy about\" ขึ้นอยู่กับบริบท\n\nแปลตรงตัวยาก เพราะคำว่า \"เกรงใจ\" ในภาษาไทยมีความหมายหลายแง่มุม เช่น เกรงใจว่าจะทำผิดพลาด เกรงใจความรู้สึกของผู้อื่น เกรงใจจะรับรู้ไม่ดี จากคนอื่น เป็นต้น ในขณะที่คำในภาษาอังกฤษไม่มีคำใดครอบคลุมความหมายทั้งหมดนี้ได้ครบถ้วน เช่น คำว่า \"feel uneasy\" เกี่ยวข้องแค่ความไม่สบายใจ ไม่ได้บ่งบอกถึงความรู้สึกอายหรือกลัวผลตอบแทนจากผู้อื่นเท่าที่ควร", "score": ""}, {"id": "q17", "question": "คำว่า \"เกรงใจ\" แปลเป็นภาษาอังกฤษว่าอะไร และทำไมถึงแปลตรงตัวยาก", "choice": "B", "answer": "คำว่า \"เกรงใจ\" แปลเป็นภาษาอังกฤษได้หลายแบบ ขึ้นอยู่กับบริบท เช่น:\n\n- **feel uneasy** (ถ้าหมายถึงรู้สึกไม่สบายใจ)\n- **feel hesitant** (ถ้าหมายถึงไม่กล้าทำสิ่งใดสิ่งหนึ่ง)\n- **be shy** (ถ้าหมายถึงรู้สึกอาย)\n- **feel embarrassed** (ถ้ารู้สึกอายหรือไม่ค่อยมั่นใจ)\n\nแต่การแปลตรงตัวว่า \"feel afraid\" หรือ \"be afraid\" ก็ไม่ถูกต้อง เพราะ \"เกรงใจ\" ไม่ใช่ความกลัวในเชิงกายภาพ แต่เป็นความรู้สึกไม่สบายใจ หรือกลัวที่จะทำผิดหรือไม่เหมาะสม\n\n### ทำไมถึงแปลตรงตัวยาก?\n1. **ความหมายเชิงอารมณ์ที่ซับซ้อน**: \"เกรงใจ\" ไม่ใช่แค่ความกลัว แต่รวมถึงความรู้สึกไม่แน่ใจ กลัวว่าจะถูกลงโทษ หรือถูกตัดสิน\n2. **ไม่มีคำอังกฤษที่แปลตรงเดิม**: ไม่มีคำในภาษาอังกฤษที่แปล \"เกรงใจ\" ได้ตรงกับความหมายเดิม ดังนั้นต้องใช้คำที่ใกล้เคียงตามบริบท\n3. **ความแตกต่างทางวัฒนธรรม**: ความรู้สึก \"เกรงใจ\" ในไทยมักเกี่ยวกับสังคม ความสัมพันธ์ หรือการกระทำที่อาจทำให้รู้สึกผิดหรือไม่เหมาะสม ซึ่งไม่จำเป็นต้องมีในบริบทของความกลัวทั่วไป\n\nดังนั้น การแปล \"เกรงใจ\" ต้องพิจารณาบริบท ไม่ใช่แปลตรงตัวเพียงอย่างเดียว", "score": ""}, {"id": "q17", "question": "คำว่า \"เกรงใจ\" แปลเป็นภาษาอังกฤษว่าอะไร และทำไมถึงแปลตรงตัวยาก", "choice": "C", "answer": "คำว่า \"เกรงใจ\" แปลเป็นภาษาอังกฤษได้หลายแบบ ขึ้นอยู่กับบริบท แต่คำที่ใกล้เคียงที่สุดคือ:\n\n* **Consideration** (ความคำนึงถึง/ความเกรงใจ)\n* **Deference** (ความนอบน้อม/การให้เกียรติ)\n* **Hesitation/Reluctance** (ในแง่ของการลังเลเพราะไม่อยากทำให้ลำบาก)\n\n**ทำไมถึงแปลตรงตัวยาก:**\n\nความยากในการแปลตรงตัวเกิดจาก **บริบททางวัฒนธรรม (Cultural Context)** และ **ความรู้สึกที่ซับซ้อน (Nuance of Feeling)** ของคำว่า \"เกรงใจ\" ในภาษาไทย ซึ่งเป็นแนวคิดที่ฝังรากลึกในสังคมไทย\n\n1. **ไม่ใช่แค่การ \"คิด\" แต่เป็นการ \"ระมัดระวัง\":** \"เกรงใจ\" ไม่ใช่แค่การคิดอย่างมีเหตุผล แต่เป็นการแสดงออกถึงความรู้สึกว่า **\"ไม่อยากเป็นภาระ\"** หรือ **\"ไม่อยากสร้างความลำบากใจ\"** ให้กับอีกฝ่าย การแปลตรงตัวเป็นแค่ \"consideration\" อาจไม่สื่อถึงน้ำหนักของความรู้สึกนี้ได้เต็มที่\n\n2. **การแสดงออกทางสังคม (Social Implication):** คำนี้สื่อถึงการปรับพฤติกรรมหรือคำพูดเพื่อให้สอดคล้องกับสถานะของอีกฝ่าย หรือเพื่อรักษาความสัมพันธ์ที่ดีไว้ การแปลเป็นคำเดียวมักจะขาดมิติของการปฏิสัมพันธ์ทางสังคมนั้นไป\n\n**สรุป:** การแปลที่ดีที่สุดคือการเลือกคำภาษาอังกฤษที่ **สื่อถึงความหมายและเจตนา** ของการ \"ระมัดระวังตนเองเพื่อไม่ให้เป็นการรบกวนผู้อื่น\" มากกว่าการแปลตามตัวอักษร (Literal Translation) ครับ", "score": ""}, {"id": "q18", "question": "ซื้อของ 3 ชิ้น ชิ้นละ 45 บาท จ่ายแบงก์ 500 ได้เงินทอนเท่าไร แสดงวิธีคิด", "choice": "A", "answer": "ราคาของ 3 ชิ้น = 3 × 45 = 135 บาท  \nจ่ายแบงก์ 500 บาท  \nเงินทอน = 500 - 135 = 365 บาท  \n\nตอบ: ได้เงินทอน 365 บาท", "score": ""}, {"id": "q18", "question": "ซื้อของ 3 ชิ้น ชิ้นละ 45 บาท จ่ายแบงก์ 500 ได้เงินทอนเท่าไร แสดงวิธีคิด", "choice": "B", "answer": "ราคาของทั้ง 3 ชิ้น = 3 × 45 = 135 บาท  \nจ่าย 500 บาท  \nเงินทอน = 500 - 135 = 365 บาท  \n\n**คำตอบ: 365 บาท**  \n**วิธีคิด:**  \n3 × 45 = 135  \n500 - 135 = 365", "score": ""}, {"id": "q18", "question": "ซื้อของ 3 ชิ้น ชิ้นละ 45 บาท จ่ายแบงก์ 500 ได้เงินทอนเท่าไร แสดงวิธีคิด", "choice": "C", "answer": "**วิธีคิด:**\n\n1. **คำนวณราคารวมของสินค้า:**\n   $45 \\text{ บาท/ชิ้น} \\times 3 \\text{ ชิ้น} = 135 \\text{ บาท}$\n\n2. **คำนวณเงินทอนที่ได้รับ:**\n   $500 \\text{ บาท} - 135 \\text{ บาท} = 365 \\text{ บาท}$\n\n**คำตอบ:** ไ "question": "อ่านหนังสือสอบไม่ทัน เหลือเวลา 3 วัน ควรวางแผนอย่างไร", "choice": "A", "answer": "ควรเริ่มต้นทันทีโดยแบ่งเนื้อหาออกเป็นส่วนย่อยๆ  \nจัดเวลาฝึกฝนทุกวัน 3 วันต่อเนื่อง  \nเน้นทบทวนสิ่งที่เรียนแล้วบ่อยๆ  \nใช้เวลาสั้นๆ วิ่งอ่านหรือทบทวนสั้นๆ ก่อนนอน  \nหากยังไม่พอ ขอความช่วยเหลือจากครูหรือเพื่อนที่เรียนเก่ง", "score": ""}, {"id": "q21", "question": "อ่านหนังสือสอบไม่ทัน เหลือเวลา 3 วัน ควรวางแผนอย่างไร", "choice": "B", "answer": "ถ้าเหลือเวลา 3 วัน และอ่านหนังสือสอบไม่ทัน ควรวางแผนอย่างมีประสิทธิภาพดังนี้:\n\n### 1. **วิเคราะห์ว่ามีเนื้อหาอะไรบ้าง**\n- จดรายการเนื้อหาที่ต้องเรียน (แบ่งตามหัวข้อ)\n- ระบุว่าเนื้อหาไหนสำคัญ หรือมีน้ำหนักสูงสุด (เช่น ข้อสอบที่มักออกบ่อย)\n\n### 2. **แบ่งเวลา 3 วัน ให้ชัดเจน**\n- วันที่ 1: เรียนเนื้อหาที่ยากที่สุด หรือมีความไม่เข้าใจ\n- วันที่ 2: โฟกัสที่เนื้อหาที่ง่าย หรือที่เคยเรียนแล้วแต่ลืม\n- วันที่ 3: ฝึกทำข้อสอบ หรือซ้ำเนื้อหาที่เคยผิด เพื่อฝึกการจำและเข้าใจ\n\n### 3. **เรียน 2–3 ชั่วโมงต่อวัน (รวมพัก)**\n- อย่าเรียนยาวเกินไป ให้เน้น **ความเข้าใจ ไม่ใช่การอ่านเพียงเพื่อให้เสร็จ**\n- ใช้เทคนิค **การตั้งเป้าหมายเล็กๆ** เช่น “วันนี้จะเข้าใจหัวข้อ A ได้”\n\n### 4. **ใช้เทคนิคการจำที่มีประสิทธิภาพ**\n- **การสรุปสั้นๆ** (สรุปเป็นจุดสำคัญ 1 บรรทัดต่อหัวข้อ)\n- **การใช้สีหรือภาพ** เพื่อจำง่าย\n- **การใช้เทคนิค 3-2-1**: 3 ข้อที่สำคัญ, 2 ตัวอย่าง, 1 คำถามที่ตั้งขึ้น\n\n### 5. **วันสุดท", "score": ""}, {"id": "q21", "question": "อ่านหนังสือสอบไม่ทัน เหลือเวลา 3 วัน ควรวางแผนอย่างไร", "choice": "C", "answer": "เพื่อให้การวางแผนมีประสิทธิภาพสูงสุด ลองทำตามขั้นตอนเหล่านี้ดูนะคะ:\n\n**1. ประเมินสถานการณ์ปัจจุบัน (วันนี้/พรุ่งนี้เช้า):**\n\n* **ลิสต์เนื้อหาทั้งหมด:** รวบรวมหัวข้อ/บทเรียนทั้งหมดที่ต้องอ่านให้ครบ\n* **จัดลำดับความสำคัญ (Prioritize):** แยกเนื้อหาออกเป็น 3 กลุ่ม:\n    * **กลุ่ม A (สำคัญที่สุด):** หัวข้อที่ออกสอบบ่อย หรือเป็นเนื้อหาที่ยังไม่เข้าใจเลย\n    * **กลุ่ม B (สำคัญรองลงมา):** หัวข้อที่พอเข้าใจแต่ต้องทบทวน\n    * **กลุ่ม C (เสริม):** เนื้อหาที่อ่านแล้วเข้าใจดีอยู่แล้ว หรือเป็นส่วนที่ใช้เวลาไม่มาก\n\n**2. จัดสรรเวลาแบบเข้มข้น (3 วัน):**\n\n* **แบ่งเวลาเป็นช่วงสั้นๆ แต่เน้นทำ (Pomodoro Technique):** อ่าน 45-50 นาที พัก 10-15 นาที เพื่อให้สมองไม่ล้า\n* **เน้นการทำโจทย์/สรุป มากกว่าการอ่านผ่านๆ:** ใน 3 วันนี้ ให้เน้นการ **ทบทวนสิ่งที่จำได้** และ **การทำโจทย์** เพื่อดูว่าจุดอ่อนของคุณอยู่ที่ไหน\n* **จัดตารางแบบยืดหยุ่น:** กำหนดเป้าหมายรายชั่วโมง ไม่ใช่รายวัน เช่น \"วันนี้ต้องจบเนื้อหา A และทำโจทย์ 50 ข้อ\"\n\n**3. กลยุทธ์การอ่านสำหรับ 3 วันสุดท้าย:**\n\n* **วันแรก: เก็บเนื้อหาหลัก (Focus on Coverage):** เน้นอ่านเนื้อหาในกลุ่ม A ให้จบให้ได้มากที่สุด\n* **วันที่สอง: เจาะลึกจุดอ่อน (Focus on Weaknesses):** ทบทวนเฉพาะส่วนที่คุณทำข้อสอบผิดบ่อย หรือส่วนที่คุณยังไม่เข้าใจ\n* **วันที่สาม: ทบทวนและจำ (Focus on Review & Recall):** เน้นการอ่านสรุปย่อ (Mind Maps, Flashcards) หรือการท่องจำสูตร/คำจำกัดความสำคัญ\n\n**4. การดูแลตัวเอง (สำคัญมาก):**\n\n* **พักผ่อนให้เพียงพอ:** การอดนอนจะทำให้สมองทำงานได้แย่ลง ให้นอนให้ได้ 7-8 ชั่วโมงต่อคืน\n* **กินอาหารที่มีประโยชน์:** หลีกเลี่ยงของหวานจัด เน้นอาหารที่ช่วยให้สมองทำงานได้ดี", "score": ""}, {"id": "q22", "question": "นอนไม่หลับบ่อย ๆ มีวิธีช่วยอะไรบ้างที่ไม่ต้องใช้ยา", "choice": "A", "answer": "มีหลายวิธีที่คุณสามารถลองทำเพื่อช่วยให้นอนหลับดีขึ้นโดยไม่ต้องใช้ยา ดังนี้ค่ะ:\n\n**1. ปรับสุขอนามัยการนอน (Sleep Hygiene):**\n\n* **กำหนดเวลานอนที่แน่นอน:** พยายามเข้านอนและตื่นนอนในเวลาเดียวกันทุกวัน แม้แต่วันหยุด เพื่อปรับนาฬิกาชีวิตของคุณ\n* **สร้างสภาพแวดล้อมที่เหมาะสม:** ห้องนอนควรจะมืด เงียบ และเย็นสบาย\n* **หลีกเลี่ยงสิ่งกระตุ้นก่อนนอน:** งดการใช้หน้าจอ (โทรศัพท์, แท็บเล็ต, คอมพิวเตอร์) อย่างน้อย 1 ชั่วโมงก่อนนอน เพราะแสงสีฟ้าจะยับยั้งการหลั่งเมลาโทนิน (ฮอร์โมนที่ช่วยให้นอนหลับ)\n* **จำกัดคาเฟอีนและแอลกอฮอล์:** หลีกเลี่ยงเครื่องดื่มที่มีคาเฟอีน (กาแฟ, ชา, น้ำอัดลม) ในช่วงบ่ายแก่ ๆ และหลีกเลี่ยงแอลกอฮอล์ก่อนนอน เพราะแม้จะทำให้ง่วง แต่จะรบกวนคุณภาพการนอนหลับ\n\n**2. การผ่อนคลายก่อนนอน (Relaxation Techniques):**\n\n* **การทำสมาธิ (Meditation):** ลองใช้แอปพลิเคชันหรือวิดีโอแนะนำการทำสมาธิเพื่อช่วยให้จิตใจสงบลง\n* **การหายใจลึก ๆ:** ฝึกการหายใจเข้าลึก ๆ ช้า const ids=[...new Set(D.rows.map(r=>r.id))];let i=0;
const K="aipc-rate:"+ids.length+":"+D.rows.length;
let S={};try{S=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
function put(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
document.getElementById("rub").innerHTML=Object.keys(D.rubric).sort().reverse()
  .map(k=>"<div><b>"+k+"</b> "+esc(D.rubric[k])+"</div>").join("");
function show(){
  const id=ids[i];const rs=D.rows.filter(r=>r.id===id);
  const done=D.rows.filter(r=>S[r.id+":"+r.choice]).length;
  document.getElementById("prog").textContent="ข้อ "+(i+1)+"/"+ids.length+" · ให้คะแนนแล้ว "+done+"/"+D.rows.length;
  let h='<div class="card"><div class="muted">'+esc(id)+'</div><b>'+esc(rs[0].question)+'</b></div>';
  for(const r of rs){
    const k=r.id+":"+r.choice;
    h+='<div class="card"><b>คำตอบ '+esc(r.choice)+'</b><div class="ans">'+esc(r.answer)+'</div><div class="sc">';
    for(let n=1;n<=5;n++){h+='<button data-k="'+esc(k)+'" data-n="'+n+'" class="'+(S[k]==n?"on":"")+'">'+n+'</button>'}
    h+='</div></div>';
  }
  document.getElementById("q").innerHTML=h;window.scrollTo(0,0);
}
document.getElementById("q").addEventListener("click",e=>{
  const b=e.target.closest("button[data-k]");if(!b)return;
  S[b.dataset.k]=Number(b.dataset.n);put();show();
});
function go(d){i=Math.min(ids.length-1,Math.max(0,i+d));show()}
function cell(t){t=String(t);return /[",\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}
function save(){
  const miss=D.rows.filter(r=>!S[r.id+":"+r.choice]).length;
  if(miss&&!confirm("ยังไม่ได้ให้คะแนน "+miss+" คำตอบ · ส่งออกต่อไหม (ตัวรวมคะแนนจะไม่ยอมรวมจนกว่าจะครบ)"))return;
  const lines=["id,question,choice,answer,score"].concat(
    D.rows.map(r=>[r.id,r.question,r.choice,r.answer,S[r.id+":"+r.choice]||""].map(cell).join(",")));
  const blob=new Blob(["﻿"+lines.join("\n")+"\n"],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="rate-"+((document.getElementById("rater").value||"rater").replace(/[^A-Za-z0-9_-]/g,"")||"rater")+".csv";
  a.click();
}
show();
